# CI — runs on every PR and push to a long-lived branch.
# Mirrors CONTRIBUTING.md §7 pre-PR checklist so nothing merges broken.
#
# `master` is listed because it is the branch this repository actually uses.
# The workflow previously triggered only on `main` and `develop`, neither of
# which exists here — so every one of the 148 tags to date was cut without a
# single CI run. `main`/`develop` are kept so the rename in CONTRIBUTING.md §8
# can happen without a window where nothing is checked.
name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  frontend:
    name: Frontend — Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Route and guard audit
        # Fails the build on an unreachable route, an unguarded private area,
        # a routerLink to nowhere, or an endpoint under /admin without AdminGuard.
        run: node scripts/route-audit.mjs

      - name: i18n and locale audit
        # Fails on a malformed bundle, a placeholder dropped in translation, or
        # the frontend and backend locale lists drifting apart — which would
        # make sitemap.xml advertise locale URLs that do not exist.
        run: node scripts/i18n-audit.mjs

      - name: Install
        working-directory: frontend
        run: npm ci
      # No Lint step for the frontend: ESLint is not installed here yet. The
      # backend now has it and its step is a real gate; angular-eslint is a
      # larger job (template rules, a fresh pile of findings) and is still
      # outstanding — see docs/OPERATIONS.md. The type check below is a real
      # gate and already passes locally.
      - name: Typecheck
        # `ng build` typechecks, but only for the production configuration.
        # This catches a type error in code that only the staging or
        # development environment file reaches.
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Test
        working-directory: frontend
        run: npx ng test --watch=false

      # Every environment is built, not just production. The three differ by
      # file replacement, so a broken staging environment file is invisible
      # until a staging deploy fails — which is the worst time to find it.
      - name: Build (production)
        working-directory: frontend
        run: npm run build:prod

      # Both checks below read dist/, and production is the only build with
      # indexable: true — staging and development deliberately strip
      # canonical/hreflang and ship an unminified bundle (see
      # SeoService.setCanonical and environment.ts). They must run here,
      # before the staging/development builds overwrite this same dist/
      # directory, or they end up asserting on the wrong build's output.
      - name: Prerendered output sanity
        working-directory: frontend
        run: |
          set -e
          PRERENDER=dist/mastande-frontend/browser
          for page in index.html pricing/index.html how-it-works/index.html advertise/index.html; do
            test -f "$PRERENDER/$page" || { echo "❌ $page was not prerendered"; exit 1; }
          done
          # Locale-prefixed pages must prerender too, or a crawler gets a
          # client-side shell where translated HTML was promised.
          for locale in af zu; do
            test -f "$PRERENDER/$locale/index.html" || { echo "❌ /$locale was not prerendered"; exit 1; }
          done
          # Metadata must be in the served HTML, not applied after hydration.
          grep -q 'rel="canonical"' "$PRERENDER/pricing/index.html" || { echo "❌ no canonical in prerendered output"; exit 1; }
          grep -q 'hreflang=' "$PRERENDER/pricing/index.html" || { echo "❌ no hreflang alternates in prerendered output"; exit 1; }
          grep -q 'name="robots"' "$PRERENDER/pricing/index.html" || { echo "❌ no robots directive in prerendered output"; exit 1; }
          echo "✅ prerender, canonical, hreflang and robots all present"
      - name: Bundle size budget check
        # This used to measure `main*.js` alone against 500 KB. Under the
        # esbuild builder main-*.js is a 7 KB bootstrap and the dependencies
        # live in sibling chunk-*.js files, so the check compared 7 KB against
        # 500 KB and could never fail. The script reads index.html and sums
        # every script the browser fetches before the page is interactive —
        # 138 KB gzipped, not 7.
        run: node scripts/bundle-budget.mjs

      - name: Build (staging)
        working-directory: frontend
        run: npm run build:staging
      - name: Build (development)
        working-directory: frontend
        run: npx ng build --configuration development

      - name: Environment parity
        # Each environment file must define the same keys. A key present in
        # production and missing from staging is a runtime undefined that no
        # typecheck catches, because each file is compiled in isolation.
        run: node scripts/env-parity.mjs

  backend:
    name: Backend — Typecheck, Test, Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mastande_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Prisma generate + migrate + seed
        working-directory: backend
        # Seeding is what makes the smoke test's skipped sections run: without
        # the place taxonomy and the demo campaigns, four of its checks skip
        # themselves and verify nothing.
        run: |
          npx prisma generate && npx prisma migrate deploy
          npx ts-node prisma/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/mastande_test
          DIRECT_URL: postgresql://postgres:test@localhost:5432/mastande_test
          ADMIN_EMAIL: ci-admin@mastande.test
          ADMIN_PASSWORD: CiSmokeAdmin123
          SEED_DEMO_ADS: 'true'
          SEED_DEMO_ROOMS: 'true'
          SEED_LAUNCH_CODES: 'true'
      - name: Lint
        # ESLint is installed on the backend now (eslint.config.mjs), and the
        # script no longer passes --fix — CI must report on the code that was
        # pushed, not quietly rewrite it and build the result. It found three
        # dead imports and an unused `crypto` import that turned out to be the
        # Resend webhook's missing signature verification.
        working-directory: backend
        run: npm run lint
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Test
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/mastande_test
          JWT_SECRET: test-secret-minimum-32-characters-long-ok
          NODE_ENV: test
      - name: Build
        working-directory: backend
        run: npm run build

      # The real backend gate. There are no unit tests — `npm test` is an
      # honest stub — but scripts/smoke-test.sh has existed all along and
      # nothing ever ran it. It drives the whole MVP against a live API:
      # auth, refresh-token rotation, the room and application lifecycle,
      # messaging, phone verification, and four IDOR checks that a second
      # tenant cannot read, post into, accept or list another tenant's
      # application. 270 assertions.
      #
      # Cross-tenant isolation is the one class of bug here that is both
      # silent and serious, and this is the only thing in the repository
      # that checks it.
      - name: Start API
        working-directory: backend
        run: |
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/health || { echo "::error::API never came up"; cat /tmp/api.log; exit 1; }
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/mastande_test
          DIRECT_URL: postgresql://postgres:test@localhost:5432/mastande_test
          JWT_SECRET: test-secret-minimum-32-characters-long-ok
          JWT_EXPIRES_IN: 15m
          NODE_ENV: development
          APP_ENV: development
          SITE_URL: http://localhost:4200
          FRONTEND_URL: http://localhost:4200
          API_URL: http://localhost:3000
          PORT: '3000'
          # Not a secret — a fixed test value, so the smoke test can sign a
          # webhook and assert that verification accepts a good signature and
          # refuses a forged or replayed one. Without it those checks skip.
          RESEND_WEBHOOK_SECRET: whsec_Q2lTbW9rZVRlc3RTZWNyZXRWYWx1ZTEyMzQ1
          # Also not a secret — a fixed test value, so the smoke test can sign
          # a WhatsApp delivery and prove verification accepts a real signature
          # and refuses a tampered body. Without it those two checks skip.
          WHATSAPP_APP_SECRET: ci-whatsapp-app-secret-0123456789
          # PayFast's own published sandbox merchant. Not a secret, and no
          # money can move through it — it is here so the API will build a
          # signed payment form, which is what the verification fee and the
          # refund drive both need to reach a payment row at all.
          PAYFAST_MERCHANT_ID: '10000100'
          PAYFAST_MERCHANT_KEY: 46f0cd694581a
          PAYFAST_SANDBOX: 'true'

      - name: API smoke test
        # With an admin token the suite runs its admin-only sections instead of
        # skipping them — the moderation queue, ad management and the KPI
        # endpoints, including the negative checks that a non-admin is refused.
        # That is 352 assertions rather than 269.
        run: ADMIN_TOKEN=$(./scripts/admin-token.sh) ./scripts/smoke-test.sh
        env:
          API: http://localhost:3000
          RESEND_WEBHOOK_SECRET: whsec_Q2lTbW9rZVRlc3RTZWNyZXRWYWx1ZTEyMzQ1
          WHATSAPP_APP_SECRET: ci-whatsapp-app-secret-0123456789
          ADMIN_EMAIL: ci-admin@mastande.test
          ADMIN_PASSWORD: CiSmokeAdmin123

      - name: Refund promise
        # The pricing page promises a full refund when we cannot verify
        # someone. This drives that path, and it is separate from the smoke
        # suite because reaching a paid check needs a PayFast ITN that PayFast
        # itself confirms — so it seeds that one row directly and drives the
        # rest through the real API. See the header of the script.
        run: node scripts/refund-drive.mjs
        env:
          API_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:test@localhost:5432/mastande_test
          ADMIN_EMAIL: ci-admin@mastande.test
          ADMIN_PASSWORD: CiSmokeAdmin123

      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log

  # Browser tests. These existed in e2e/ from early on and nothing ever ran
  # them; the first execution found two real bugs (prerendered pages not being
  # served at all, and a 404 page with no h1).
  #
  # Two passes, because no single build configuration can run the whole suite:
  #
  #   locale-and-seo asserts rel="canonical", which SeoService only emits when
  #   environment.indexable is true — and production is the only configuration
  #   where it is. The one test in that file needing a live room self-skips.
  #
  #   The app-flow and mobile specs drive real journeys, so they need an API
  #   they can reach — and production points apiUrl at api.mastande.co.za,
  #   which is not reachable from CI. The development build points at
  #   localhost, which is where the API below is running.
  #
  # Running everything against one build would mean either no canonical or no
  # API, so one half would always fail for a reason unrelated to the change
  # being tested.
  e2e:
    name: E2E — browser journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mastande_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/mastande_test
      DIRECT_URL: postgresql://postgres:test@localhost:5432/mastande_test
      E2E_BASE_URL: http://localhost:4200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install (root, for Playwright)
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start the API
        working-directory: backend
        run: |
          npm ci
          npx prisma generate && npx prisma migrate deploy
          # The board must not be empty: application-lifecycle.spec.ts applies
          # for the first room on it. Nothing seeded rooms before, so the first
          # run of this job failed on `app-room-card a` not existing.
          SEED_DEMO_ROOMS=true npx ts-node prisma/seed.ts
          npm run build
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/health || { echo "::error::API never came up"; cat /tmp/api.log; exit 1; }
        env:
          JWT_SECRET: test-secret-minimum-32-characters-long-ok
          JWT_EXPIRES_IN: 15m
          NODE_ENV: development
          APP_ENV: development
          SITE_URL: http://localhost:4200
          FRONTEND_URL: http://localhost:4200
          API_URL: http://localhost:3000
          PORT: '3000'
          ADMIN_EMAIL: ci-admin@mastande.test
          ADMIN_PASSWORD: CiSmokeAdmin123

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # Pass 1 — development build, which points at the API started above.
      - name: Build frontend (development) and serve
        working-directory: frontend
        # NG_ALLOWED_HOSTS: Angular 21 validates the Host header against an
        # allow-list, which server.ts builds from the environment file's
        # siteUrl. `localhost` is already in it for a development build; it is
        # set here too so both passes are configured the same way and pass 2,
        # below, does not look like an exception.
        env:
          NG_ALLOWED_HOSTS: localhost
        run: |
          npx ng build --configuration development
          PORT=4200 node dist/mastande-frontend/server/server.mjs > /tmp/fe.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4200/ >/dev/null && break; sleep 2; done
          curl -sf http://localhost:4200/ >/dev/null || { echo "::error::frontend never came up"; cat /tmp/fe.log; exit 1; }

      - name: E2E — app journeys
        run: npx playwright test --project=desktop e2e/account-settings.spec.ts e2e/application-lifecycle.spec.ts e2e/listing-wizard.spec.ts

      - name: E2E — mobile board
        run: npx playwright test --project=mobile

      # Pass 2 — production build, the only one that emits canonical.
      - name: Build frontend (production) and serve
        working-directory: frontend
        # Required here, not optional: a production build allows only
        # mastande.co.za and www.mastande.co.za, so without this every
        # Server-mode route answers 400 and the SEO spec below fails on
        # /rooms/:id rather than on anything it is testing.
        env:
          NG_ALLOWED_HOSTS: localhost
        run: |
          pkill -f "mastande-frontend/server/server.mjs" || true
          npm run build:prod
          PORT=4200 node dist/mastande-frontend/server/server.mjs > /tmp/fe-prod.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4200/ >/dev/null && break; sleep 2; done
          curl -sf http://localhost:4200/ >/dev/null || { echo "::error::frontend never came up"; cat /tmp/fe-prod.log; exit 1; }

      - name: E2E — locale routing and server-rendered SEO
        run: npx playwright test --project=desktop e2e/locale-and-seo.spec.ts

      - name: Logs and traces on failure
        if: failure()
        run: |
          echo "── API ──";      tail -50 /tmp/api.log     2>/dev/null || true
          echo "── frontend ──"; tail -50 /tmp/fe.log      2>/dev/null || true
          tail -50 /tmp/fe-prod.log 2>/dev/null || true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm install
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
