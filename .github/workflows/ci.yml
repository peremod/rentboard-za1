# CI — runs on every PR and push to main/develop.
# Mirrors CONTRIBUTING.md §7 pre-PR checklist so nothing merges broken.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend — Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npx ng test -- --watch=false
      - name: Build (production)
        working-directory: frontend
        run: npm run build:prod
      - name: Bundle size budget check
        working-directory: frontend
        run: |
          BUNDLE=$(find dist -name "main*.js" -path "*browser*" | xargs cat | gzip -c | wc -c)
          echo "Main bundle gzipped: ${BUNDLE} bytes"
          if [ "$BUNDLE" -gt 512000 ]; then echo "❌ Exceeds 500KB budget"; exit 1; fi

  backend:
    name: Backend — Lint, Test, Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rentboard_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Prisma generate + migrate
        working-directory: backend
        run: npx prisma generate && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/rentboard_test
          DIRECT_URL: postgresql://postgres:test@localhost:5432/rentboard_test
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Test
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/rentboard_test
          JWT_SECRET: test-secret-minimum-32-characters-long-ok
          NODE_ENV: test
      - name: Build
        working-directory: backend
        run: npm run build

  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
