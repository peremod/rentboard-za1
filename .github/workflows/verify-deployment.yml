# Asserts a deployed environment is configured the way it claims to be.
#
# This was the last step of deploy-backend.yml, which deployed to Railway.
# Railway is gone and Render deploys straight from the repo (see render.yaml),
# so there is no longer a GitHub job wrapped around the deploy — but the check
# itself never needed one. It only curls the public API, so it works against
# any host.
#
# Keeping it matters more now, not less: with Render deploying out-of-band,
# nothing in GitHub otherwise reports whether a deploy happened or what
# configuration it came up with.
#
# ── Why this file was rewritten (v1.65.0) ────────────────────────────────
# It had never once completed. Nineteen runs, every one of them stuck
# in_progress in the same step until GitHub killed it at the six-hour mark —
# burning six hours of runner time per push to report nothing. Four faults,
# each of which alone would have been enough:
#
#   1. No timeout anywhere. `curl -sf` with no --max-time waits forever on a
#      host that accepts a connection and never answers, which is exactly
#      what a suspended Render service does. One hung curl froze the loop,
#      and with no job-level timeout-minutes the runner sat there until the
#      platform's own limit.
#   2. The "not deployed yet, skip" guard was dead code. It tested DNS, and
#      *.onrender.com is a wildcard — a service that has never existed
#      resolves exactly like one that does. Verified:
#      definitely-not-a-real-service-xyz123.onrender.com resolves. So the
#      skip branch could never be taken and the job always fell through to
#      the curl loop.
#   3. It pointed at mastande-api.onrender.com. The service was called
#      rentboard-api; the rename had not happened yet. So it was polling a
#      host that did not serve this API.
#
#      ⚠️ READ THIS AS HISTORY, NOT AS THE MAPPING. The rename LANDED on
#      13 October and this paragraph outlived it: mastande-api is now the
#      STAGING service and rentboard-api the PRODUCTION one. Taking the
#      sentence above as current advice is how STAGING_API_HOST came to hold
#      the production host — see the note on the env: block below.
#   4. It asserted nothing about *which build* answered, so even a pass would
#      not have told you a deploy had happened — only that something was up.
#
# What replaces them: an explicit configuration switch instead of a DNS
# heuristic, bounded timeouts on every network call, a job ceiling, and a
# version assertion that makes a green run mean "the commit I just pushed is
# the commit that is serving traffic".
name: Verify deployment

on:
  push:
    # ⚠️ BOTH branches now. This said "only develop… there is no production
    # service yet. Add master here in the same change that adds one" — and
    # §59 added `rentboard-api` with `branch: master` without coming back
    # here, so THREE RELEASES WENT TO PRODUCTION WITH NOTHING VERIFYING THEM.
    # The instruction was written down and not followed, which is the same
    # family as the render.yaml header that went on denying production
    # existed 170 lines above the service that defined it.
    branches: [develop, master]
    paths: ['backend/**', 'render.yaml']
  workflow_dispatch:

jobs:
  verify:
    name: Deployed configuration
    runs-on: ubuntu-latest
    # A ceiling, not an expectation. The work below is bounded to well under
    # this; the point is that nothing here can ever again occupy a runner for
    # six hours because one network call did not return.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Verify the deployment
        env:
          # ⚠️ The expectations INVERT between the two environments, which is
          # why this is one job with a switch rather than two copies: staging
          # must refuse every crawler and must not advertise production URLs;
          # production must do the opposite. §59 records the reverse fault —
          # production mislabelled `staging` would refuse every crawler, and
          # a staging-shaped check would have called that a pass.
          TARGET_BRANCH: ${{ github.ref_name }}
          PRODUCTION_API_HOST: ${{ vars.PRODUCTION_API_HOST }}
          STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
          #
          # 🔴 THIS COMMENT USED TO GIVE THE WRONG VALUE, and the wrong value
          # is what got set. It read: set STAGING_API_HOST "to the host
          # staging actually serves from — today `rentboard-api.onrender.com`".
          # `rentboard-api` is PRODUCTION (render.yaml line 197, `branch:
          # master`); staging is `mastande-api` (line 51, `branch: develop`).
          # The sentence was true when written — before the 13 October rename,
          # when one service served everything — and nothing came back to it.
          # Run 89 on 20 October duly failed with "STAGING IS CRAWLABLE",
          # having fetched production's robots.txt.
          #
          # The correct values, from render.yaml, which is the only place the
          # branch→service mapping is written down:
          #
          #   STAGING_API_HOST     mastande-api.onrender.com     (develop)
          #   PRODUCTION_API_HOST  api.umastande.co.za           (master)
          #                        — or rentboard-api.onrender.com
          #
          # Set both at Settings → Secrets and variables → Actions →
          # Variables. Neither may be left unset: see the guard below.
        run: |
          set -euo pipefail

          # Which environment this run is about, decided by the branch that
          # triggered it — the same mapping render.yaml uses, so the two
          # cannot disagree about which host serves which branch.
          if [ "${TARGET_BRANCH:-}" = "master" ]; then
            ENV_NAME="production"
            HOST="${PRODUCTION_API_HOST:-}"
            HOST_VAR="PRODUCTION_API_HOST"
          else
            ENV_NAME="staging"
            HOST="${STAGING_API_HOST:-}"
            HOST_VAR="STAGING_API_HOST"
          fi

          # 🔴 THIS WAS `exit 0` AND THAT IS HOW IT REPORTED SUCCESS WHILE
          # VERIFYING NOTHING. Run 88 (master, 20 October) is green in the
          # Actions list; its log says `PRODUCTION_API_HOST: ` and
          # "⏭️  No PRODUCTION_API_HOST repository variable is set." A green
          # tick was read as "production verified" when the variable had
          # never been set — the skip path WAS the pass.
          #
          # The "nothing to verify yet" reading that justified exit 0 expired
          # on 13 October. render.yaml now defines a service for BOTH
          # branches, so for either value of $ENV_NAME there is a live
          # deployment this workflow is supposed to be checking, and an unset
          # variable is a configuration gap rather than an absence of subject.
          # A missing variable must therefore be RED: the one thing it may
          # not do is look like a pass.
          if [ -z "$HOST" ]; then
            echo "❌ No $HOST_VAR repository variable is set, so nothing was"
            echo "   verified for $ENV_NAME — and this is a FAILURE rather"
            echo "   than a skip precisely so it cannot be mistaken for one."
            echo
            echo "   render.yaml defines a deployed service for both branches:"
            echo "     STAGING_API_HOST     mastande-api.onrender.com"
            echo "     PRODUCTION_API_HOST  api.umastande.co.za"
            echo
            echo "   Set it at Settings → Secrets and variables → Actions →"
            echo "   Variables, then re-run this workflow."
            exit 1
          fi

          API="https://$HOST"
          echo "Verifying $ENV_NAME at $API"

          # Every call is bounded. --connect-timeout covers a host that never
          # completes a handshake; --max-time covers one that connects and
          # then goes quiet. Without both, a sleeping free-tier service hangs
          # the job rather than failing it.
          fetch() { curl -sS --connect-timeout 10 --max-time 25 "$@"; }

          # Render's free tier sleeps after ~15 minutes idle and takes 30-60s
          # to wake, and this races the deploy Render starts when the push
          # lands. Eight minutes of polling covers a cold build plus a wake.
          # Each attempt is individually bounded, so a hung request costs one
          # attempt rather than the job.
          HEALTH=""
          for i in $(seq 1 32); do
            if HEALTH=$(fetch -f "$API/health" 2>/dev/null); then break; fi
            HEALTH=""
            sleep 15
          done

          if [ -z "$HEALTH" ]; then
            echo "❌ $API/health never answered within 8 minutes."
            echo "   Either the deploy failed, the service is suspended, or"
            echo "   $HOST_VAR points at a host that does not serve"
            echo "   this API. Note that any *.onrender.com name resolves"
            echo "   whether or not a service exists behind it, so a typo"
            echo "   here looks exactly like an outage."
            exit 1
          fi

          echo "$HEALTH"

          # The assertion that makes a pass mean something. Without it a green
          # run says only "something answered", which is true of a build from
          # three weeks ago.
          DEPLOYED=$(echo "$HEALTH" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          EXPECTED=$(node -p "require('./backend/package.json').version")
          if [ "$DEPLOYED" = "$EXPECTED" ]; then
            echo "✅ serving $DEPLOYED, which is the version in this commit"
          else
            echo "❌ $ENV_NAME is serving $DEPLOYED but this commit is $EXPECTED."
            echo "   The deploy has not landed yet, or it failed and Render is"
            echo "   still serving the previous build. Check the Render"
            echo "   dashboard before trusting anything else in this run."
            exit 1
          fi

          # ⚠️ WHICH environment answered, before judging how it behaves.
          #
          # 🔴 Without this the check misdiagnoses a wrong host as a wrong
          # APP_ENV. Measured on 20 October: STAGING_API_HOST was set to
          # rentboard-api.onrender.com, which render.yaml defines as the
          # PRODUCTION service (mastande-api is staging). The run failed with
          # "STAGING IS CRAWLABLE. Check APP_ENV" — correct that something was
          # wrong, and pointing at the wrong thing. APP_ENV was right; the
          # host was production.
          #
          # /health already returns `env`, so the service can be asked who it
          # thinks it is. A host that answers with the other environment is a
          # variable fault, and says so.
          CLAIMED=$(echo "$HEALTH" | sed -n 's/.*"env":"\([^"]*\)".*/\1/p')

          # ⚠️ An ABSENT `env` is a failure, not a skip. The version
          # assertion directly above has already established that the build
          # from this commit is the one answering, and this commit's
          # health.controller.ts returns `env` unconditionally — so if it is
          # missing here, the parse is broken, and "skip when empty" would
          # turn the whole assertion below into a check that cannot fail.
          if [ -z "$CLAIMED" ]; then
            echo "❌ /health did not report an \`env\` field, but the service"
            echo "   is serving $DEPLOYED — this commit's build, which always"
            echo "   returns one (backend/src/modules/health/health.controller.ts)."
            echo "   So this is a parsing fault in THIS workflow, not a"
            echo "   deployment fault. Failing rather than skipping: a skip"
            echo "   here disables the environment-identity check silently."
            exit 1
          fi

          if [ "$CLAIMED" != "$ENV_NAME" ]; then
            echo "❌ $HOST_VAR points at a $CLAIMED service, but this run is"
            echo "   verifying $ENV_NAME."
            echo
            echo "   The host is wrong, not the deployment. render.yaml:"
            echo "   mastande-api serves staging (develop), rentboard-api"
            echo "   serves production (master). Fix $HOST_VAR rather than"
            echo "   APP_ENV — everything below this would misdiagnose."
            exit 1
          fi
          echo "✅ the service identifies as $CLAIMED, which is what was asked for"

          # The database is the other half of a deploy. Render deploying new
          # code without `npm run migrate:staging` having been run is the
          # single most common way this environment breaks, and it surfaces
          # as a 500 on one endpoint rather than as an unhealthy service —
          # so /health reporting a live database is worth asserting here.
          case "$HEALTH" in
            *'"db":"connected"'*) echo "✅ database is connected" ;;
            *) echo "❌ the API is up but its database is not reachable."; exit 1 ;;
          esac

          # The part a health check cannot cover: that the deployment is
          # indexable if and only if it is production.
          ROBOTS=$(fetch -f "$API/robots.txt")
          echo "$ROBOTS"

          # ⚠️ Here the two environments want OPPOSITE things, and asserting
          # one shape against both is how the reverse fault hides. §59: a
          # production service mislabelled `staging` refuses every crawler —
          # catastrophic, and indistinguishable from a healthy staging box to
          # any check that only knows how staging should look.
          if [ "$ENV_NAME" = "production" ]; then
            if echo "$ROBOTS" | grep -q "^Disallow: /$"; then
              echo "❌ PRODUCTION IS REFUSING EVERY CRAWLER. Check APP_ENV —"
              echo "   it must be 'production'. The site is live and invisible"
              echo "   to search engines until this is fixed."
              exit 1
            fi
            echo "$ROBOTS" | grep -q "umastande.co.za/sitemap" \
              || { echo "❌ production is not advertising its sitemap — check SITE_URL"; exit 1; }
            echo "✅ production is healthy, current, and crawlable"
          else
            echo "$ROBOTS" | grep -q "^Disallow: /$" \
              || { echo "❌ STAGING IS CRAWLABLE. Check APP_ENV — it must be 'staging', not 'production'."; exit 1; }

            if echo "$ROBOTS" | grep -q "//umastande.co.za/sitemap"; then
              echo "❌ staging is advertising production URLs — check SITE_URL"
              exit 1
            fi
            echo "✅ staging is healthy, current, and refuses all crawlers"
          fi
