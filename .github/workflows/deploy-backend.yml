# Deploys the NestJS backend to Railway.
#   master / main  → production
#   develop        → staging
#
# `master` is included in every conditional below. It was previously handled in
# the GitHub `environment:` line but NOT in the Railway `--environment` flag, so
# a push to master would have loaded production secrets and deployed them to the
# staging service.
name: Deploy Backend

on:
  push:
    branches: [master, main, develop]
    paths: ['backend/**']

env:
  # Single source of truth for the branch → environment mapping, so the two
  # cannot drift apart again.
  TARGET: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'production' || 'staging' }}

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        working-directory: backend
        run: railway up --service rentboard-api --environment "$TARGET"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Run database migrations
        working-directory: backend
        run: railway run --environment "$TARGET" npx prisma migrate deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify environment configuration
        # The API refuses to start on a misconfigured environment, so a healthy
        # /health already proves SITE_URL, JWT secrets and APP_ENV are present.
        # This asserts the part a health check cannot: that the deployment is
        # indexable if and only if it is production.
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            API="https://api.rentboard.co.za"
            EXPECT_ALLOW=1
          else
            API="https://api-staging.rentboard.co.za"
            EXPECT_ALLOW=0
          fi

          # Give the container a moment to come up before asserting.
          for i in $(seq 1 20); do
            if curl -sf "$API/health" >/dev/null; then break; fi
            sleep 5
          done
          curl -sf "$API/health" >/dev/null || { echo "❌ $API/health never came up"; exit 1; }

          ROBOTS=$(curl -sf "$API/robots.txt")
          echo "$ROBOTS"

          if [ "$EXPECT_ALLOW" = "1" ]; then
            echo "$ROBOTS" | grep -q "^Allow: /$" \
              || { echo "❌ production robots.txt does not allow crawling"; exit 1; }
            echo "$ROBOTS" | grep -q "Sitemap: https://rentboard.co.za/sitemap.xml" \
              || { echo "❌ production sitemap URL is wrong — SITE_URL is misconfigured"; exit 1; }
            echo "✅ production is crawlable and advertises the correct sitemap"
          else
            echo "$ROBOTS" | grep -q "^Disallow: /$" \
              || { echo "❌ STAGING IS CRAWLABLE. Check APP_ENV — it must be 'staging', not 'production'."; exit 1; }
            echo "$ROBOTS" | grep -qv "rentboard.co.za/sitemap" \
              || { echo "❌ staging is advertising production URLs — check SITE_URL"; exit 1; }
            echo "✅ staging refuses all crawlers"
          fi
