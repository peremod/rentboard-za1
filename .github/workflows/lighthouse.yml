# Lighthouse — runs on PRs that touch the frontend, and weekly against production.
#
# Split from ci.yml deliberately. A Lighthouse run takes several minutes and is
# mildly non-deterministic; making it a separate required check means a flaky
# run blocks a merge visibly rather than making the whole CI job look broken.
#
# Budgets live in lighthouserc.json. Targets match OPERATIONS.md §3:
# Performance ≥ 90 mobile, Accessibility / Best Practices / SEO all 100.
name: Lighthouse

on:
  pull_request:
    branches: [master, main, develop]
    paths: ['frontend/**']
  schedule:
    # Mondays 05:00 UTC — 07:00 SAST, ahead of the weekly funnel review.
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  budgets:
    name: Budgets against a production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build:prod

      - name: Run Lighthouse CI
        working-directory: frontend
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=../lighthouserc.json || STATUS=$?
          # Same summary as the production job, and for the same reason: the
          # uploaded report has no shift details. `if: always()` would not help
          # here — autorun exits non-zero on a failed assertion, so the status
          # is held and re-raised after the numbers are printed.
          #
          # ⚠️ This job cannot see the board's real CLS. The bundle fetches
          # rooms from api.umastande.co.za, which the runner's browser is not
          # allowed to use cross-origin, so / renders an empty board: 0.026
          # here against 0.953 on the live site. A green CLS in this job is a
          # statement about a board with no cards in it.
          node ../scripts/lhr-summary.mjs .lighthouseci
          exit ${STATUS:-0}
        env:
          # Posts the run as a PR status check with a link to the full report.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          # A production build allows only the real domain, so the server it
          # boots must be told localhost is expected. The audited URLs are all
          # prerendered and would be served without it, but /rooms/:id would
          # not, and that is exactly the page to add to this list next.
          NG_ALLOWED_HOSTS: localhost
          # And it must be told that localhost IS the site for this run, not a
          # copy of it. Without this the server does the right thing for a
          # copy — robots.txt answers `Disallow: /` — and Lighthouse then
          # scores all four URLs blocked from indexing: is-crawlable 0,
          # categories:seo 0.66 against a budget of 1.0. That is what this job
          # reported on every run from the day it was written until 21 October,
          # including run 10. Reproduced locally by serving the bundle and
          # reading robots.txt, and the fix measured the same way: seo 0.66 →
          # 1.00, is-crawlable 0 → 1. It widens nothing — the X-Robots-Tag
          # header and the meta tag still keep a copy out of any index.
          SITE_CANONICAL_HOSTS: localhost

  production:
    name: Weekly production audit
    # Only on the schedule — a PR cannot audit a site it has not deployed to.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      # The domain is registered separately from this repo, and until it
      # resolves this job failed every Monday on a DNS error — four minutes of
      # runner time to report something nobody could act on, which is how a
      # red check becomes background noise. It says why it stopped instead.
      - name: Is the site live yet?
        id: live
        run: |
          if curl -sfI --connect-timeout 10 --max-time 20 https://www.umastande.co.za/ >/dev/null 2>&1; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::https://www.umastande.co.za does not answer yet — skipping the production audit. This is expected until the domain is registered and pointed at Vercel."
          fi

      - name: Audit production
        if: steps.live.outputs.live == 'true'
        # ⚠️ --config on EVERY subcommand, and not optional. lhci discovers
        # lighthouserc.json from the working directory, which is the repo root
        # here — so `lhci collect --url=…` read that file's startServerCommand
        # and tried to boot a server out of a dist/ this job never builds. Run
        # 10 died on `Cannot find module …/dist/mastande-frontend/server/
        # server.mjs`, MODULE_NOT_FOUND, 11 seconds in, having collected
        # nothing. Every weekly run since the domain started answering has
        # ended there.
        #
        # URLs and thresholds live in lighthouserc.production.json. They used
        # to be written here as inline flags while lighthouserc.json carried
        # different numbers for the same four metrics — two sources of truth
        # for one budget.
        #
        # ⚠️ `|| true` used to end the preset line below AND it was the only
        # assert in this job, which made the whole audit a collection exercise:
        # three runs of Lighthouse, every score discarded, a green tick
        # whatever happened. The preset stays non-blocking on purpose — it
        # asserts dozens of audits and a brand-new failure in any one of them
        # would block a release for something nobody chose to care about, so it
        # is printed for a human to read. The blocking assert is the one after
        # it, which has no `|| true`.
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci collect --config=lighthouserc.production.json
          # Printed BEFORE the assert, so it is in the log whether the gate
          # passes or fails. `lhci upload` sanitises the report it publishes —
          # run 11 measured CLS 0.953 on the board and the published report
          # carried `layout-shifts` with a null score and no details, so the
          # one number worth acting on could be seen and not explained.
          node scripts/lhr-summary.mjs .lighthouseci
          lhci upload --config=lighthouserc.production.json
          lhci assert --config=lighthouserc.production.json --preset=lighthouse:recommended || true
          lhci assert --config=lighthouserc.production.json

      # ⚠️ A second Lighthouse, on purpose, and only for the board.
      #
      # lhci 0.14 bundles Lighthouse 12.1, whose RootCauses gatherer throws on
      # this page — `layout-shifts: score null mode error`, errorMessage
      # `Cannot read properties of undefined (reading 'frame_sequence')` — so
      # the audit that names WHAT shifted cannot run in the collection above.
      # 12.8 produces it. One run, one URL, after the gate, so a red CLS comes
      # with the elements that moved instead of a number nobody can act on.
      - name: What shifted on the board
        if: ${{ !cancelled() && steps.live.outputs.live == 'true' }}
        run: |
          npm install -g lighthouse@12.8.2
          lighthouse https://www.umastande.co.za/ \
            --quiet --output=json --output-path=./board-lhr.json \
            --form-factor=mobile --screenEmulation.mobile --throttling-method=simulate \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage"
          node scripts/lhr-summary.mjs ./board-lhr.json

      - name: Verify sitemap URLs all resolve
        # ⚠️ `!cancelled()`, because a step's default condition is success() and
        # this one spent run 13 SKIPPED — the audit above failed on the board's
        # CLS, and a sitemap check that stops running whenever an unrelated
        # metric regresses is a check held hostage by another. A soft 404 in a
        # submitted sitemap is exactly what nobody would notice while a
        # performance number is red.
        if: ${{ !cancelled() && steps.live.outputs.live == 'true' }}
        # A sitemap entry that 404s is a soft-404 signal we are submitting
        # ourselves. Cheap to check, invisible if we do not.
        run: |
          set -o pipefail
          BAD=$(curl -sf https://www.umastande.co.za/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' \
            | xargs -P 8 -I {} sh -c 'code=$(curl -s -o /dev/null -w "%{http_code}" "{}"); [ "$code" = "200" ] || echo "$code {}"')
          if [ -n "$BAD" ]; then
            echo "❌ sitemap entries not returning 200:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ every sitemap URL returns 200"
