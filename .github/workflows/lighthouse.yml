# Lighthouse — runs on PRs that touch the frontend, and weekly against production.
#
# Split from ci.yml deliberately. A Lighthouse run takes several minutes and is
# mildly non-deterministic; making it a separate required check means a flaky
# run blocks a merge visibly rather than making the whole CI job look broken.
#
# Budgets live in lighthouserc.json. Targets match OPERATIONS.md §3:
# Performance ≥ 90 mobile, Accessibility / Best Practices / SEO all 100.
name: Lighthouse

on:
  pull_request:
    branches: [master, main, develop]
    paths: ['frontend/**']
  schedule:
    # Mondays 05:00 UTC — 07:00 SAST, ahead of the weekly funnel review.
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  budgets:
    name: Budgets against a production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build:prod

      - name: Run Lighthouse CI
        working-directory: frontend
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=../lighthouserc.json
        env:
          # Posts the run as a PR status check with a link to the full report.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  production:
    name: Weekly production audit
    # Only on the schedule — a PR cannot audit a site it has not deployed to.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      - name: Audit production
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci collect \
            --url=https://rentboard.co.za/ \
            --url=https://rentboard.co.za/pricing \
            --url=https://rentboard.co.za/how-it-works \
            --numberOfRuns=3
          lhci assert --preset=lighthouse:recommended || true
          lhci upload --target=temporary-public-storage

      - name: Verify sitemap URLs all resolve
        # A sitemap entry that 404s is a soft-404 signal we are submitting
        # ourselves. Cheap to check, invisible if we do not.
        run: |
          set -o pipefail
          BAD=$(curl -sf https://rentboard.co.za/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' \
            | xargs -P 8 -I {} sh -c 'code=$(curl -s -o /dev/null -w "%{http_code}" "{}"); [ "$code" = "200" ] || echo "$code {}"')
          if [ -n "$BAD" ]; then
            echo "❌ sitemap entries not returning 200:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ every sitemap URL returns 200"
