# Lighthouse — runs on PRs that touch the frontend, and weekly against production.
#
# Split from ci.yml deliberately. A Lighthouse run takes several minutes and is
# mildly non-deterministic; making it a separate required check means a flaky
# run blocks a merge visibly rather than making the whole CI job look broken.
#
# Budgets live in lighthouserc.json. Targets match OPERATIONS.md §3:
# Performance ≥ 90 mobile, Accessibility / Best Practices / SEO all 100.
name: Lighthouse

on:
  pull_request:
    branches: [master, main, develop]
    paths: ['frontend/**']
  schedule:
    # Mondays 05:00 UTC — 07:00 SAST, ahead of the weekly funnel review.
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  budgets:
    name: Budgets against a production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build:prod

      - name: Run Lighthouse CI
        working-directory: frontend
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=../lighthouserc.json
        env:
          # Posts the run as a PR status check with a link to the full report.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          # A production build allows only the real domain, so the server it
          # boots must be told localhost is expected. The audited URLs are all
          # prerendered and would be served without it, but /rooms/:id would
          # not, and that is exactly the page to add to this list next.
          NG_ALLOWED_HOSTS: localhost

  production:
    name: Weekly production audit
    # Only on the schedule — a PR cannot audit a site it has not deployed to.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      # The domain is registered separately from this repo, and until it
      # resolves this job failed every Monday on a DNS error — four minutes of
      # runner time to report something nobody could act on, which is how a
      # red check becomes background noise. It says why it stopped instead.
      - name: Is the site live yet?
        id: live
        run: |
          if curl -sfI --connect-timeout 10 --max-time 20 https://umastande.co.za/ >/dev/null 2>&1; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::https://umastande.co.za does not answer yet — skipping the production audit. This is expected until the domain is registered and pointed at Vercel."
          fi

      - name: Audit production
        if: steps.live.outputs.live == 'true'
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci collect \
            --url=https://umastande.co.za/ \
            --url=https://umastande.co.za/pricing \
            --url=https://umastande.co.za/how-it-works \
            --numberOfRuns=3
          # ⚠️ `|| true` used to end this line, which made the whole audit a
          # collection exercise: three runs of Lighthouse, every score
          # discarded, and a green tick whatever happened. Performance and SEO
          # could regress for months without a single red build — a check that
          # cannot fail, in the workflow whose job is to catch regressions.
          #
          # The recommended preset stays NON-blocking, because it asserts
          # dozens of audits and a brand-new failure in any one of them would
          # block a release for something nobody chose to care about. It is
          # printed for a human to read.
          lhci assert --preset=lighthouse:recommended || true

          # These do block, and they are deliberately few. Each is a number
          # this product has a real stake in, on the slow Android phone it is
          # built for, and each is set at the level the site should not fall
          # BELOW rather than at an aspiration:
          #
          #   · SEO 0.9      — metadata, crawlability, tap targets. A drop here
          #                    is almost always an accident.
          #   · LCP 4000ms   — the board's hero and first room card. Google's
          #                    "poor" threshold is 4s; this fails only when a
          #                    real person would call the page slow.
          #   · CLS 0.1      — the "good" bound. Layout shift on a listing
          #                    card is how somebody taps the wrong room.
          #   · TBT 600ms    — a proxy for INP, which Lighthouse cannot
          #                    measure in a lab run (it needs real
          #                    interactions). Named as a proxy rather than
          #                    reported as INP, because they are not the same
          #                    metric and saying otherwise would be a claim
          #                    this workflow cannot support.
          lhci assert \
            --assertions.categories:seo="error,minScore=0.9" \
            --assertions.largest-contentful-paint="error,maxNumericValue=4000" \
            --assertions.cumulative-layout-shift="error,maxNumericValue=0.1" \
            --assertions.total-blocking-time="error,maxNumericValue=600"

          lhci upload --target=temporary-public-storage

      - name: Verify sitemap URLs all resolve
        if: steps.live.outputs.live == 'true'
        # A sitemap entry that 404s is a soft-404 signal we are submitting
        # ourselves. Cheap to check, invisible if we do not.
        run: |
          set -o pipefail
          BAD=$(curl -sf https://umastande.co.za/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' \
            | xargs -P 8 -I {} sh -c 'code=$(curl -s -o /dev/null -w "%{http_code}" "{}"); [ "$code" = "200" ] || echo "$code {}"')
          if [ -n "$BAD" ]; then
            echo "❌ sitemap entries not returning 200:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ every sitemap URL returns 200"
