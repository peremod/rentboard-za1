# Deploys the Angular SSR frontend to Vercel on push to main (production)
# or develop (staging) — matches CONTRIBUTING.md §8 environment-branch mapping.
name: Deploy Frontend

on:
  push:
    branches: [main, develop]
    paths: ['frontend/**']

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (production config on main, staging config on develop)
        working-directory: frontend
        run: npm run ${{ github.ref_name == 'main' && 'build:prod' || 'build:staging' }}

      - name: Deploy to Vercel
        working-directory: frontend
        run: vercel deploy --prebuilt ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
