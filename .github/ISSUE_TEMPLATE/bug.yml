name: Bug report
description: Something works differently than it should
labels: ["type:bug", "needs:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in what you can. An incomplete report is better than no report — but the environment and the URL are what make a bug reproducible, so please do not skip those two.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a landlord
        2. Go to /landlord/create-room
        3. …
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: The three environments differ by build configuration, so this narrows it immediately.
      options:
        - Production (mastande.co.za)
        - Staging (staging.mastande.co.za)
        - Local development
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact page, including any locale prefix (/af/, /zu/).
      placeholder: https://mastande.co.za/rooms/abc123
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth / session
        - Room listing / wizard
        - Applications / messaging
        - Payments / Stripe
        - Search / board
        - Admin
        - i18n / translations
        - SEO / metadata
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: "P1 means auth, payments or publishing is broken — those are the three that stop the business. Guardrail: zero P1s unresolved past 24 hours."
      options:
        - P1 — auth, payments or publishing broken
        - P2 — a core flow is degraded
        - P3 — cosmetic or edge case
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Android 14, Chrome 130, slow 4G

  - type: textarea
    id: extra
    attributes:
      label: Console errors, screenshots, Sentry link
