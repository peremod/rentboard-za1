<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8"/>
  <title>Mastande — Rooms to Rent in South Africa, No Agent Fees</title>
  <base href="/"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Find a room to rent direct from landlords across South Africa. Free to apply, always. No estate agent, no application fees."/>
  <meta name="theme-color" content="#AD4222"/>
  <!--
    Icons.

    ⚠️ The SVG alone was not enough for Google. Its favicon guidance asks for
    a raster square whose side is a MULTIPLE OF 48px, and a site that offers
    only an SVG can end up with the generic globe beside its result. These are
    rendered from favicon.svg itself rather than redrawn, so every size is the
    same mark.

    ⚠️ They are also listed in angular.json `assets`. A file sitting in src/
    that nothing lists is not copied into the build — it would 404 in
    production while working perfectly in `ng serve`, which is the worst kind
    of missing asset.
  -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="48x48" href="icon-48.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>

  <!-- Room images are served from ImageKit and include the LCP element on
       both the board and room detail, so the connection is opened early. -->
  <link rel="preconnect" href="https://ik.imagekit.io"/>

  <!--
    Fonts, self-hosted — 25 October 2026.

    This block used to fetch a stylesheet from fonts.googleapis.com, which then
    fetched the files from fonts.gstatic.com: two third-party origins, two DNS
    lookups and two TLS handshakes before a letter could be drawn in the right
    face, on the slow connections this product exists to work on. The comment
    that stood here named self-hosting as the "preferred next step"; this is it.

    The reason it finally happened is Cumulative Layout Shift. `display=swap`
    paints in the fallback and REFLOWS when the files land, and the live board
    measured CLS 0.071 with Lighthouse naming the cause twice over — "Web font
    loaded", against the hero stats and the trust strip. The faces now declare
    `font-display: optional` (see styles.scss), which decides the layout once:
    used from the first paint if the file is there, fallback for that view if
    it is not, and no reflow either way.

    ⚠️ Only the LATIN subsets are preloaded. latin-ext exists for Sepedi's š
    and the other marks the eleven locales need, and it is fetched by
    unicode-range only on a page that actually contains one — preloading it
    would make every visitor pay for it.

    ⚠️ `crossorigin` is required even same-origin. A font is a CORS-mode
    request; without the attribute the preload is fetched a SECOND time by the
    CSS, which is worse than not preloading at all.
  -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/assets/fonts/dm-sans-latin.woff2"/>
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/assets/fonts/playfair-display-latin.woff2"/>

  <!-- Social defaults. SeoService overwrites these per route; they exist so a
       crawler that renders no JavaScript still gets a usable card. -->
  <meta property="og:site_name" content="Mastande"/>
  <meta property="og:type" content="website"/>
  <meta property="og:locale" content="en_ZA"/>
  <meta property="og:title" content="Mastande — Rooms to Rent in South Africa, No Agent Fees"/>
  <meta property="og:description" content="Find a room to rent direct from landlords across South Africa. Free to apply, always."/>
  <!-- ⚠️ www, not the apex. This said `https://umastande.co.za/...`, and per
       environment.prod.ts the apex is a DIFFERENT host — the old cPanel box,
       which answers `301 → https://www.umastande.co.za/`. A redirect to the
       site ROOT, not to the file: a crawler following it is handed HTML where
       it asked for a PNG, and the preview card breaks. (That redirect is the
       repo's own documented knowledge of the host, not something checked from
       this container.)

       This block is only ever served from index.csr.html — the shell used when
       server rendering is bypassed. Every real route is rendered by SeoService,
       which builds the URL from the environment's own siteUrl, so staging and
       development do not advertise production's image. -->
  <meta property="og:image" content="https://www.umastande.co.za/assets/images/og-default.png"/>
  <!-- Facebook and WhatsApp both use these to decide on a large card WITHOUT
       fetching the image first, and WhatsApp is the channel that matters here:
       landlords share room links over it constantly. 1200×630 is the measured
       size of the file, not a convention copied in. -->
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:image:type" content="image/png"/>
  <meta property="og:image:alt" content="Mastande — rooms to rent in South Africa, direct from landlords"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:image:alt" content="Mastande — rooms to rent in South Africa, direct from landlords"/>
</head>
<body>
  <app-root></app-root>
</body>
</html>
