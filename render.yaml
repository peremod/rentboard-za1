# Render blueprint — free-tier staging.
#
# This is the backend deploy path. Railway was dropped, and its workflow and
# railway.json went with it. Render deploys straight from the repo on push, so
# it needs no CI token and no secrets in GitHub.
#
# The tradeoff of deploying out-of-band is that GitHub sees nothing: no job,
# no status, no log. .github/workflows/verify-deployment.yml exists to put one
# signal back — it waits for the deploy and asserts the environment came up
# configured as staging.
#
# There is NO PRODUCTION SERVICE defined here yet. The free tier is not a
# production target (see below), so production currently has no backend deploy
# path at all.
#
# Set it up: Render dashboard → New → Blueprint → point at this repo.
#
# THE FREE TIER SLEEPS after roughly 15 minutes of no traffic, and the next
# request takes 30–60 seconds to wake it. That is survivable for staging and a
# poor experience for real users, so treat this as a staging target rather than
# a production one.
#
# Free-tier terms change. Check Render's current pricing page before relying on
# any of the limits described here.

services:
  # ── STAGING ───────────────────────────────────────────────────────────────
  #
  # The rename LANDED on 13 October: `mastande-api` exists and serves staging,
  # `rentboard-api` kept the production role, and both are live. The note that
  # used to sit here described the cutover as still pending and is gone.
  #
  # ⚠️ Render keys a Blueprint service on its NAME, which is why that cutover
  # created a second service rather than renaming the first. The same is true
  # in reverse now: change `name:` below and you do not rename this service,
  # you create another one and leave this one running.
  - type: web
    name: mastande-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt          # closest Render region to South Africa
    branch: develop            # staging — the only environment Render serves
    healthCheckPath: /health

    # NO preDeployCommand: Render's free tier does not support it, and the
    # Blueprint is rejected outright if one is present.
    #
    # Migrations therefore run by hand before each deploy:
    #
    #   cd backend
    #   DATABASE_URL="$NEON_POOLED" DIRECT_URL="$NEON_DIRECT" \
    #     npx prisma migrate deploy
    #
    # That is worse than automatic — it can be forgotten, and then the API
    # starts against a schema it does not expect. Add preDeployCommand back the
    # day this moves to a paid instance. Until then, docs/DEPLOYMENT.md makes
    # migrating a required step rather than an optional one.

    envVars:
      # NODE_ENV is a BUILD concern: Nest and Express both want `production`
      # here for performance and to suppress verbose error output, even though
      # this is a staging box. Keep it as-is.
      - key: NODE_ENV
        value: production

      # APP_ENV is the DEPLOYMENT concern, and is what actually decides
      # indexability, CORS origins and payment sandbox mode. It must say
      # `staging` here. Gating those on NODE_ENV instead is what would make
      # this box fully crawlable while every file looked correct.
      - key: APP_ENV
        value: staging

      # Public origin of the FRONTEND for this environment, no trailing slash.
      # Builds sitemap.xml and robots.txt. There is no fallback — the API
      # refuses to start without it, deliberately, because the old fallback
      # was the production origin.
      - key: SITE_URL
        value: https://rentboard-za1.vercel.app

      - key: PORT
        value: 3000

      # Generated once by Render and kept. Never reuse development secrets.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m

      # Set by hand in the dashboard once the URLs are known — they are
      # circular, so the first deploy will have them wrong.
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false

      - key: DATABASE_URL
        sync: false            # from Neon or Render Postgres, see docs

      # Google sign-in. Without these the handshake returns 503 and the
      # button appears to do nothing — see docs/AUTHENTICATION.md. The
      # callback must match the URI registered for THIS environment.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false

      # WhatsApp Business API (Meta). Never declared here before, so staging
      # had no way to be given them through the Blueprint at all — WhatsApp
      # was optional when the only thing it did was notify. Phase 2 puts
      # listing creation and rent reminders on it, so it is no longer.
      #
      # WHATSAPP_APP_SECRET is the one that is easy to miss: it is separate
      # from the verify token and it is what signs every inbound webhook. The
      # webhook refuses every delivery without it, by design, so inbound
      # replies simply stop arriving rather than being silently trusted.
      - key: WHATSAPP_API_VERSION
        value: v19.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_SANDBOX
        value: "true"

  # ── PRODUCTION ────────────────────────────────────────────────────────────
  #
  # Added 13 October, after the dashboard and this file were found to disagree
  # about something neither recorded: `rentboard-api` carries APP_ENV=production
  # and the production Neon branch, and it was deploying from `develop`. So a
  # push to `master` deployed nothing, every push to `develop` went straight to
  # production, and staging and production received the same commit at the same
  # moment — staging gated nothing. The branch is `master` now; this block is
  # what stops the repository being silent about it again.
  #
  # ⚠️⚠️ READ BEFORE THE FIRST SYNC OF THIS BLOCK. This service ALREADY EXISTS.
  # A Blueprint matches on `name`, so every field below must match what the
  # dashboard already has, or the sync changes live production:
  #
  #   · `name` must be exactly `rentboard-api`. Anything else creates a SECOND
  #     production service on a new hostname — the identical mistake the
  #     staging block above records, and api.umastande.co.za would keep
  #     pointing at the old one.
  #   · `plan` must match the instance it is actually on. Declaring `free` on a
  #     paid instance DOWNGRADES it. It is written as `free` because that is
  #     what the staging block uses and this repository has no record of the
  #     production plan — CONFIRM IT IN THE DASHBOARD AND CORRECT THIS LINE
  #     BEFORE SYNCING.
  #   · `branch` must be `master`. That is the fix this block exists to record.
  #
  # Every `sync: false` value stays as the dashboard has it: Render does not
  # overwrite those, which is the point of the flag.
  - type: web
    name: rentboard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                 # ⚠️ CONFIRM against the dashboard — see above
    region: frankfurt
    branch: master             # production. Was `develop`, which is the bug.
    healthCheckPath: /health

    # No preDeployCommand here either, for the same reason as staging: the free
    # tier rejects it. Production migrations are run by hand BEFORE the push,
    # with scripts/migrate-remote.sh, never `npx prisma migrate deploy` — see
    # docs/OUTSTANDING.md §5a for the hour production spent down over exactly
    # that distinction.

    envVars:
      - key: NODE_ENV
        value: production

      # The one line that separates this service from staging in behaviour:
      # indexability, CORS origins and PayFast live mode all read APP_ENV.
      - key: APP_ENV
        value: production

      - key: SITE_URL
        value: https://www.umastande.co.za

      - key: PORT
        value: 3000

      # ⚠️ sync: false, NOT generateValue. The staging block generates this
      # because a fresh secret there costs nothing. Here a regenerated secret
      # invalidates every live session and every refresh token in circulation —
      # it signs them all. It is set in the dashboard and the Blueprint must
      # never touch it.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m

      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false

      # ⚠️ BOTH are required. `prisma migrate` connects through directUrl, not
      # url, so a DIRECT_URL missing here is how a migration silently lands
      # somewhere else. The pooled host is the one with `-pooler` in it; the
      # direct host is the one without.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false

      - key: WHATSAPP_API_VERSION
        value: v19.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false

      # ⚠️ "false" here, unlike staging. PAYFAST_SANDBOX=true in production
      # sends real payments to the sandbox; the environment guard refuses to
      # start on that combination, which is the check that makes this line
      # safe to get wrong once.
      - key: PAYFAST_SANDBOX
        value: "false"
